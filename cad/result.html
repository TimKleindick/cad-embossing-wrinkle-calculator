<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Wrinkle geometry &middot; Results</title>
<style>
:root{color-scheme:light;font:16px/1.45 system-ui,sans-serif;color:#142732;background:#edf2f3}
body{margin:0}main{max-width:1100px;margin:0 auto;padding:32px 20px 52px}
h1{margin:0 0 6px;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.035em}
h2{margin:0 0 8px;font-size:1.16rem}p{margin:0;color:#465c66}
figure,section{margin:20px 0 0;background:#fff;border:1px solid #d7e2e5;border-radius:12px;padding:18px}
.plot{overflow-x:auto}canvas{width:100%;min-width:640px;height:auto;display:block}
figcaption{display:flex;gap:12px 26px;flex-wrap:wrap;color:#364d59;font-size:.9rem}
.key{display:inline-block;width:24px;margin-right:8px;border-top:3px solid #03796d;vertical-align:middle}
.cosine{border-color:#4151aa;border-top-style:dashed}.tangent{border-color:#a45315}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:16px}.sections section{min-width:0}
section.primary{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:.94rem}
th,td{padding:7px 0;border-bottom:1px solid #e7eef0;text-align:left;vertical-align:top}
tr:last-child th,tr:last-child td{border-bottom:0}th{padding-right:12px;font-weight:600;width:30%}
td.value{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;font-weight:650}
.note{margin-top:10px;font-size:.87rem}.warning{color:#8d3b12;font-weight:650}
@media(max-width:720px){.sections{display:block}th,td{padding:6px 3px}}
</style>
</head>
<body>
<main>
<header>
<h1>Wrinkle geometry</h1>
<p>One period of the cosine reference and the fitted profile</p>
</header>
<figure>
<h2>Profile and dimensions</h2>
<div class="plot">
<canvas id="profile" width="900" height="350" role="img" aria-label="Wrinkle profile with dimensions A, l1, l2, h, R, &phi; and s">
The dimensions and their definitions are listed in the table.
</canvas>
</div>
<figcaption>
<span><i class="key cosine"></i>Cosine reference with target length l<sub>1</sub></span>
<span><i class="key"></i>Fitted profile with three arcs and two straight segments</span>
<span><i class="key tangent"></i>Straight segment s on each side</span>
</figcaption>
</figure>
<div class="sections">
<section class="primary" aria-labelledby="geometry-title">
<h2 id="geometry-title">What do the dimensions mean?</h2>
<table aria-labelledby="geometry-title"><tbody id="geometry"></tbody></table>
</section>
<section aria-labelledby="deviation-title">
<h2 id="deviation-title">Length and shape comparison</h2>
<table aria-labelledby="deviation-title"><tbody id="deviation"></tbody></table>
<p class="note" id="length-target"></p>
</section>
<section aria-labelledby="strain-title">
<h2 id="strain-title">Radii and strain estimates</h2>
<table aria-labelledby="strain-title"><tbody id="strain"></tbody></table>
<p class="note">Simplified t/(2r) estimate. Material approval and crack safety are outside its scope.</p>
</section>
</div>
</main>
<script id="result-data" type="application/json">{{DATA}}</script>
<script>
'use strict';
const {l1, l2, thickness, values, fit} = JSON.parse(document.getElementById('result-data').textContent);
const [amplitude, radius, height, angle, straight] = values;
const format = new Intl.NumberFormat('en-GB', {maximumFractionDigits: 9, useGrouping: false});
function table(id, rows) {
  const body = document.getElementById(id);
  for (const [label, definition, value, unit] of rows) {
    const row = body.insertRow();
    const header = document.createElement('th');
    header.scope = 'row';
    header.textContent = label;
    row.append(header);
    if (definition) row.insertCell().textContent = definition;
    const cell = row.insertCell();
    cell.className = 'value';
    cell.textContent = value === null ? '\u2013' : `${format.format(value)} ${unit}`;
  }
}
table('geometry', [
  ['l\u2081 \u00b7 Developed target length', 'Length along the cosine reference from end to end, measured as a 1,000-segment polyline.', l1, 'mm'],
  ['l\u2082 \u00b7 Projected width', 'Horizontal distance between the profile endpoints.', l2, 'mm'],
  ['A \u00b7 Cosine amplitude', 'Vertical distance from the cosine midline to its crest. The cosine crest is 2A above the baseline.', amplitude, 'mm'],
  ['h \u00b7 Fitted profile height', 'Vertical distance from the baseline to the crest of the fitted profile.', height, 'mm'],
  ['R \u00b7 Arc radius', 'Common radius of the three arcs in the fitted profile.', radius, 'mm'],
  ['\u03c6 \u00b7 Flank angle', 'Angle between the straight flank and the horizontal.', angle, '\u00b0'],
  ['s \u00b7 Straight length per side', 'Length of the straight segment between two arcs.', straight, 'mm']
]);
table('deviation', [
  ['Fitted polyline length', '', values[5], 'mm'],
  ['Analytic fitted length', '', values[6], 'mm'],
  ['Length deviation from l\u2081', '', values[7], '%'],
  ['RMS vertical profile deviation', '', values[8], 'mm'],
  ['Maximum vertical deviation at sample points', '', values[9], 'mm']
]);
const target = document.getElementById('length-target');
const meetsTarget = Math.abs(values[7]) < 0.1;
target.textContent = meetsTarget ? 'Length deviation is below 0.1%.' : 'Length deviation reaches or exceeds 0.1%.';
if (!meetsTarget) target.classList.add('warning');
table('strain', [
  ['Optional wall thickness t', '', thickness, 'mm'],
  ['Cosine radius using the Excel formula', '', values[10], 'mm'],
  ['Corrected cosine radius', '', values[11], 'mm'],
  ['Circular arc strain estimate', '', values[12], '%'],
  ['Cosine strain using the Excel radius', '', values[13], '%'],
  ['Cosine strain using the corrected radius', '', values[14], '%']
]);
const canvas = document.getElementById('profile');
const ctx = canvas.getContext('2d');
const scale = Math.min(650 / l2, 224 / Math.max(height, 2 * amplitude, l2 * .01));
const left = (900 - l2 * scale) / 2;
const x = distance => left + distance * scale;
const y = ordinate => 276 - ordinate * scale;
const ink = '#334d5b', blue = '#4151aa', green = '#03796d', orange = '#a45315';
function line(x1, y1, x2, y2, color = ink, dash = [], width = 1.3) {
  ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash);
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
}
function label(text, px, py, color = ink) {
  ctx.font = '600 17px system-ui'; ctx.fillStyle = color; ctx.textAlign = 'center';
  ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.strokeText(text, px, py); ctx.fillText(text, px, py);
}
function dimension(x1, y1, x2, y2, color = ink) {
  line(x1, y1, x2, y2, color);
  const alpha = Math.atan2(y2 - y1, x2 - x1);
  for (const [px, py, sign] of [[x1, y1, 1], [x2, y2, -1]]) {
    for (const delta of [-.48, .48]) {
      line(px, py, px + sign * 8 * Math.cos(alpha + delta), py + sign * 8 * Math.sin(alpha + delta), color);
    }
  }
}
function curve(points, color, dash) {
  ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.setLineDash(dash);
  points.forEach((v, i) => ctx.lineTo(x(l2 * i / (points.length - 1)), y(v)));
  ctx.stroke(); ctx.setLineDash([]);
}
const midX = x(l2 / 2), right = x(l2), baseline = y(0);
line(left, baseline, right, baseline, '#96aab2');
for (const edge of [left, right]) line(edge, baseline - 4, edge, 312, '#96aab2');
dimension(left, 306, right, 306);
label('l\u2082', midX, 330);
curve(fit, green, []);
const cosine = Array.from({length: 1001}, (_, i) => amplitude * (1 - Math.cos(2 * Math.PI * i / 1000)));
curve(cosine, blue, [8, 6]);
if (radius === null) {
  label('Flat profile: A = h = 0, l\u2081 = l\u2082', midX, 246);
} else {
  const topCosine = y(2 * amplitude), topFit = y(height);
  const halfHeight = y(amplitude), ampX = left - 30, heightX = right + 30;
  const targetX = x(.28 * l2), targetY = y(cosine[280]);
  line(x(.11 * l2), 39, targetX, targetY, blue, [4, 4]);
  label('l\u2081 along the curve', x(.11 * l2), 31, blue);
  if (baseline - topFit >= 20) {
    line(midX, topFit, heightX, topFit, '#96aab2', [4, 4]);
    line(right, baseline, heightX, baseline, '#96aab2', [4, 4]);
    dimension(heightX, topFit, heightX, baseline, green);
    label('h', heightX + 18, (topFit + baseline) / 2 + 6, green);
  }
  if (halfHeight - topCosine >= 20) {
    line(ampX, topCosine, midX, topCosine, blue, [4, 4]);
    line(ampX, halfHeight, midX, halfHeight, blue, [4, 4]);
    dimension(ampX, topCosine, ampX, halfHeight, blue);
    label('A', ampX - 16, (topCosine + halfHeight) / 2 + 5, blue);
  }
  const phi = angle * Math.PI / 180, xJoin = radius * Math.sin(phi);
  const yJoin = 2 * radius * Math.sin(phi / 2) ** 2;
  const innerJoin = l2 / 2 - xJoin;
  const innerY = yJoin + (innerJoin - xJoin) * Math.tan(phi);
  if ((innerJoin - xJoin) * scale >= 32 && baseline - topFit >= 24) {
    line(x(xJoin), y(yJoin), x(innerJoin), y(innerY), orange, [], 4);
    line(x(l2 - innerJoin), y(innerY), x(l2 - xJoin), y(yJoin), orange, [], 4);
    label('s', x(l2 - (xJoin + innerJoin) / 2) + 22, y((yJoin + innerY) / 2) + 20, orange);
    const startX = x(xJoin), startY = y(yJoin);
    line(startX, startY, startX + 52, startY, orange, [4, 3]);
    ctx.beginPath(); ctx.strokeStyle = orange; ctx.lineWidth = 1.3;
    ctx.arc(startX, startY, 35, -phi, 0); ctx.stroke();
    label('\u03c6', startX + 56, startY - 7, orange);
  }
  const radiusCenterY = y(height - radius);
  if (radiusCenterY <= baseline && radiusCenterY - topFit >= 25) {
    dimension(midX, topFit, midX, radiusCenterY, green);
    label('R', midX + 18, (topFit + radiusCenterY) / 2 + 6, green);
  }
}
</script>
</body>
</html>
