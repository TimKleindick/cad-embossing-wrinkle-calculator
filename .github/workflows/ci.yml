name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Audit tracked source (including staged blob bytes)
        run: python tools/package_preview.py audit
      - name: Check delivered single files are current
        run: python tools/build_entries.py --check
      - name: Numeric, CLI and adversarial packaging tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources (no NX runtime)
        run: python -m compileall -q wrinkle cad/nx tools
      - name: Execute actual VBA-compatible core in Windows Script Host
        if: runner.os == 'Windows'
        run: python tools/run_vbscript_tests.py
      - name: Exercise real generated Windows dialog outside NX
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: python tools/test_windows_dialog.py
      - name: Exercise the generated CATScript input form outside CATIA
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: python tools/test_catia_windows_form.py
      - name: Build and verify exact source allowlist
        run: |
          python tools/package_preview.py build
          python tools/package_preview.py verify
      # Normal CI uploads no artifacts and never uploads a workspace directory.
