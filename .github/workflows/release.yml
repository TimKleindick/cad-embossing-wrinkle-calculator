name: Source preview release (CAD untested)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag on this main commit, e.g. v0.1.0-source-preview.1'
        required: true
        type: string
      acknowledgement:
        description: 'Type CAD UNTESTED SOURCE PREVIEW to publish a prerelease'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: source-preview-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Require explicit preview acknowledgement and matching existing tag
        shell: pwsh
        env:
          PREVIEW_TAG: ${{ inputs.tag }}
          ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:ACKNOWLEDGEMENT -cne 'CAD UNTESTED SOURCE PREVIEW') { throw 'Acknowledgement required' }
          if ($env:PREVIEW_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+-source-preview\.[0-9]+$') { throw 'Preview tag required' }
          $sha = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:PREVIEW_TAG" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $sha -cne $env:GITHUB_SHA) { throw 'Existing tag must point to this main commit' }
      - run: python tools/package_preview.py audit
      - run: python -m unittest discover -s tests -v
      - run: python tools/run_vbscript_tests.py
      - run: python tools/package_preview.py build
      - run: python tools/package_preview.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-preview-verified
          path: |
            dist/wrinkle-source-preview.zip
            dist/wrinkle-source-preview.sha256
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-preview-verified
          path: dist
      - name: Recheck archive and commit provenance before publishing
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python tools/package_preview.py verify
          python -c 'import os; from tools.package_preview import validate_archive; m=validate_archive("dist/wrinkle-source-preview.zip"); assert m["revision"] == os.environ["EXPECTED_SHA"]'
          cd dist
          sha256sum --check wrinkle-source-preview.sha256
      - name: Publish explicit two-file source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ inputs.tag }}
        run: |
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PREVIEW_TAG}" --jq .sha)
          test "$tag_sha" = "$GITHUB_SHA"
          gh release create "$PREVIEW_TAG" dist/wrinkle-source-preview.zip dist/wrinkle-source-preview.sha256 --verify-tag --prerelease --title "$PREVIEW_TAG - Source Preview - CAD UNTESTED" --notes-file docs/RELEASE-NOTES.md
